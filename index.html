
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGR TOP UP SHOP</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}
header, footer {
  background: #151e35;
  text-align: center;
  padding: 20px;
}
h1, .section { color: #a99cff; }
.banner {
  width: 100%;
  height: auto;
  display: block;
}
.hero {
  text-align: center;
  padding: 30px 15px;
  background: linear-gradient(135deg,#24165c,#101d3b);
}
.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}
.section { text-align: center; }
.packages {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}
.card {
  background: #19243e;
  padding: 18px;
  text-align: center;
  border: 1px solid #46558a;
  border-radius: 12px;
}
.price {
  color: #39e6a0;
  font-size: 22px;
  font-weight: bold;
}
footer { color: #aaa; margin-top: 25px; }
@media(max-width:400px) {
  .packages { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
<h1>💎 TGR TOP UP SHOP</h1>
<p>Free Fire Diamond Top Up</p>
</header>

<img class="banner" src="banner.png"
alt="TGR Top Up Shop Banner">

<section class="hero">
<h2>Welcome to TGR Top Up Shop</h2>
<p>আপনার পছন্দের Diamond Package দেখুন</p>
</section>

<div class="container">
<h2 class="section">💎 Diamond Packages</h2>

<div class="packages">
<div class="card">
<h3>25 Diamonds</h3>
<p class="price">৳10</p>
</div>
<div class="card">
<h3>50 Diamonds</h3>
<p class="price">৳30</p>
</div>
<div class="card">
<h3>115 Diamonds</h3>
<p class="price">৳85</p>
</div>
<div class="card">
<h3>240 Diamonds</h3>
<p class="price">৳165</p>
</div>
<div class="card">
<h3>355 Diamonds</h3>
<p class="price">৳220</p>
</div>
<div class="card">
<h3>610 Diamonds</h3>
<p class="price">৳410</p>
</div>
</div>
</div>

<footer>
<p>© 2026 TGR TOP UP SHOP</p>
<p>All Rights Reserved</p>
</footer>

</body>
</html>
